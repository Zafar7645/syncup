services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      # NOTE: POSTGRES_USER/POSTGRES_PASSWORD only take effect the first time this
      # volume is initialized. If you change DB_USERNAME/DB_PASSWORD in .env later,
      # the backend will fail with "password authentication failed" until you run
      # `docker compose down -v` to drop and recreate this volume.
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Bound to loopback only — this is a database, it should never be reachable
      # from outside the host. Drop the 127.0.0.1 prefix only for local debugging.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:${FRONTEND_PORT:-4200}}
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(\"http\").get(\"http://localhost:3000\",r=>process.exit(r.statusCode<500?0:1)).on(\"error\",()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      # Always the backend container's internal listen port (see PORT above),
      # independent of BACKEND_PORT below in `ports:` which only controls the
      # host-side mapping. Do not wire this to ${BACKEND_PORT} from .env.
      BACKEND_PORT: 3000
    ports:
      - '${FRONTEND_PORT:-4200}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
